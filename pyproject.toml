[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "document-files"
version = "1.8.0"
description = "AI-assisted document schema, semantics and value extraction for applications and agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Ruzzy77"}]
requires-python = ">=3.11"
dependencies = [
  "cryptography>=50.0.1,<51",
  "defusedxml>=0.7.1,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "markdown-it-py==4.2.0",
  "mdit-py-plugins==0.6.1",
  "pdfplumber==0.11.10",
  "pypdfium2==5.13.0",
  "mcp==2.1.1",
  "jsonschema>=4.26,<5",
  "referencing>=0.37,<1",
  "olefile>=0.47,<1",
  "openpyxl>=3.1,<4",
  "pypdf>=6.14.2,<7",
  "python-docx>=1.1,<2",
  "python-hwpx==6.3.0",
  "python-hwpx-automation==7.0.3",
  "python-pptx>=1.0,<2",
  "reportlab>=4,<5",
]

[project.optional-dependencies]
recognition = ["docling==2.126.0"]

[project.urls]
Homepage = "https://github.com/Ruzzy77/document-files"
Repository = "https://github.com/Ruzzy77/document-files"
Issues = "https://github.com/Ruzzy77/document-files/issues"

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "httpx>=0.28,<1",
]

[project.scripts]
document-files = "document_files.cli:main"
document-files-mcp = "document_files.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
document_files = ["_vendor/*.md", "schemas/*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/document_files/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
