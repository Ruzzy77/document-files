[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "document-files"
version = "1.2.0"
description = "Headless document extraction and artifact tools for Codex"
requires-python = ">=3.11"
dependencies = [
  "defusedxml>=0.7.1,<1",
  "mcp==1.28.1",
  "olefile>=0.47,<1",
  "openpyxl>=3.1,<4",
  "pypdf>=6.14.2,<7",
  "python-docx>=1.1,<2",
  "python-hwpx==6.3.0",
  "python-hwpx-automation==7.0.3",
  "python-pptx>=1.0,<2",
]

[project.scripts]
document-files = "document_files.cli:main"
document-files-mcp = "document_files.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
document_files = ["native/*.swift"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
