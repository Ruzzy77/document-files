name: Build and test release candidates
# Manual only: regular commits do not start builds or send CI notifications.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'One target only; Spark development uses linux-aarch64'
        type: choice
        required: true
        default: linux-aarch64
        options:
          - linux-aarch64
          - macos-aarch64
          - linux-x86_64
          - macos-x86_64
          - windows-x86_64
permissions:
  contents: read
jobs:
  platform:
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ${{ fromJSON('{"linux-aarch64":"ubuntu-22.04-arm","macos-aarch64":"macos-14","linux-x86_64":"ubuntu-22.04","macos-x86_64":"macos-15-intel","windows-x86_64":"windows-2022"}')[inputs.target] }}
    env:
      TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.10.4'
      - name: Prepare test environment
        run: uv sync --frozen --python 3.12
      - name: Regression tests
        run: uv run --frozen pytest -q
      - name: Build checkbox-preserving backend and portable candidates
        shell: bash
        run: |
          uv run --frozen python scripts/build_patched_rhwp.py --source "${RUNNER_TEMP}/rhwp-source" --output "${RUNNER_TEMP}/rhwp-candidate"
          if [ "$RUNNER_OS" = "Linux" ]; then
            if [ "$TARGET" = "linux-aarch64" ]; then
              export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=/usr/bin/gcc-12
            else
              export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=/usr/bin/gcc-12
            fi
          fi
          # Resolve Cargo/Rust from the same source-pinned toolchain as the build.
          (
            cd "${RUNNER_TEMP}/rhwp-source"
            cargo test --locked --release -p rhwp --lib checkbox
            cargo test --locked --release -p rhwp --lib bullet
          )
          RHWP="$RUNNER_TEMP/rhwp-candidate/bin/rhwp"
          if [ "$RUNNER_OS" = "Windows" ]; then RHWP="$RHWP.exe"; fi
          uv run --frozen python scripts/build_release.py --rhwp "$RHWP" --rhwp-license "${RUNNER_TEMP}/rhwp-source/LICENSE"
          uv run --frozen python scripts/smoke_release.py "dist/document-files-1.8.0-${{ inputs.target }}.zip"
      - name: Check every Linux portable ELF against the bookworm ABI
        if: runner.os == 'Linux'
        run: uv run --frozen python scripts/linux_abi.py --archive dist/document-files-1.8.0-${{ inputs.target }}.zip --output dist/linux-abi --target "${{ inputs.target }}"
      - name: Relocated bookworm core startup (not final image qualification)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          EVIDENCE="$GITHUB_WORKSPACE/dist/bookworm-core-evidence"
          mkdir "$EVIDENCE"
          case "$TARGET" in
            linux-x86_64) PROBE_PLATFORM=linux/amd64; EXPECTED_ARCH=amd64 ;;
            linux-aarch64) PROBE_PLATFORM=linux/arm64; EXPECTED_ARCH=arm64 ;;
            *) exit 1 ;;
          esac
          export EXPECTED_ARCH
          # Native hosted runner only, no QEMU/binfmt or self-hosted registration.
          # Provision only this explicit official test image; no document-time fetch.
          timeout 300 docker pull --platform "$PROBE_PLATFORM" python:3.12-bookworm
          IMAGE=$(timeout 30 docker image inspect python:3.12-bookworm --format '{{index .RepoDigests 0}}')
          timeout 30 docker image inspect "$IMAGE" --format '{{json .}}' | python3 -c 'import json,os,sys; x=json.load(sys.stdin); assert x["Architecture"]==os.environ["EXPECTED_ARCH"] and x["Os"]=="linux"; print(json.dumps({k:x[k] for k in ("Id","RepoDigests","Architecture","Os")}))' > "$EVIDENCE/probe-image.json"
          CID=""
          cleanup() {
            if [ -s "$EVIDENCE/container-id.txt" ]; then CID=$(cat "$EVIDENCE/container-id.txt"); fi
            if [[ "$CID" =~ ^[0-9a-f]{64}$ ]]; then
              timeout 30 docker inspect "$CID" --format '{{json .State}}' > "$EVIDENCE/container-state.json" 2>&1 || true
              timeout 60 docker rm --force "$CID" > "$EVIDENCE/cleanup.txt" 2>&1
            fi
          }
          trap cleanup EXIT
          timeout 60 docker create --cidfile "$EVIDENCE/container-id.txt" --platform "$PROBE_PLATFORM" --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 \
            --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,exec,size=2g \
            --mount "type=bind,src=$GITHUB_WORKSPACE/scripts/linux_abi.py,dst=/probe.py,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/dist/document-files-1.8.0-${{ inputs.target }}.zip,dst=/input/archive.zip,readonly" \
            --mount "type=bind,src=$EVIDENCE,dst=/evidence" \
            "$IMAGE" python /probe.py --archive /input/archive.zip --output /evidence/result \
            --target "$TARGET" --startup core --startup-only > "$EVIDENCE/create.txt"
          CID=$(cat "$EVIDENCE/container-id.txt")
          timeout 30 docker inspect "$CID" --format '{{json .Image}}' > "$EVIDENCE/container-image.json"
          python3 -c 'import json,sys; from pathlib import Path; p=Path(sys.argv[1]); assert json.loads((p/"container-image.json").read_text())==json.loads((p/"probe-image.json").read_text())["Id"]' "$EVIDENCE"
          timeout 300 docker start --attach "$CID" > "$EVIDENCE/container-log.txt" 2>&1
          CODE=$(timeout 30 docker inspect "$CID" --format '{{.State.ExitCode}}')
          printf '%s\n' "$CODE" > "$EVIDENCE/container-exit.txt"
          test "$CODE" = 0
      - name: Export locked core Python dependency inventory
        shell: bash
        run: |
          uv export --frozen --no-dev --no-emit-project --format cyclonedx1.5 --output-file dist/core-python-sbom.cdx.json
          uv export --frozen --no-dev --no-emit-project --no-hashes --format requirements.txt --output-file dist/core-python-requirements.txt
      - name: Audit core Python dependencies against current advisory data
        # Public package identifiers only. This is not a native binary/model audit.
        run: uvx --from pip-audit==2.10.1 pip-audit --strict --disable-pip --no-deps -r dist/core-python-requirements.txt --format json --output dist/core-python-audit.json
      - name: Attest only artifacts built by this workflow
        if: github.event_name != 'pull_request' && github.repository == 'Ruzzy77/document-files'
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.zip
            dist/*.mcpb
            dist/*.skill
        # Assembly provenance does not attest upstream runtime/model builds or AI quality.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: candidates-${{ inputs.target }}
          path: |
            dist/
            ${{ runner.temp }}/rhwp-source/rhwp-abi.txt
            ${{ runner.temp }}/rhwp-candidate/build.json
            ${{ runner.temp }}/rhwp-candidate/rhwp-abi.txt
          if-no-files-found: error
          retention-days: 14
  # No automatic GitHub Release is published. Independent model and installed-client
  # evidence for this exact commit must pass check_release_qualification.py first.
