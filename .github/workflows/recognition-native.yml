name: Native recognition dependency candidates
on:
  push:
    paths: ['scripts/prepare_windows_build.ps1', 'scripts/windows_build_evidence.py', 'tests/test_windows_build_evidence.py', 'scripts/windows_runtime_notice.py', 'tests/test_windows_runtime_notice.py', 'scripts/build_recognition_native.py', 'scripts/recognition-native-sources.json', '.github/workflows/recognition-native.yml']
  pull_request:
    paths: ['scripts/prepare_windows_build.ps1', 'scripts/windows_build_evidence.py', 'tests/test_windows_build_evidence.py', 'scripts/windows_runtime_notice.py', 'tests/test_windows_runtime_notice.py', 'scripts/build_recognition_native.py', 'scripts/recognition-native-sources.json', 'tests/test_recognition_native_builder.py', '.github/workflows/recognition-native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.10.4'
      - run: uv sync --frozen --python 3.12
      - run: uv run --frozen python -m pytest -q -W error tests/test_recognition_native_builder.py tests/test_windows_runtime_notice.py tests/test_windows_build_evidence.py
  native:
    # Narrow builder/pin pushes bootstrap a workflow not yet on the default branch.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: contracts
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: windows-2022
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Linux native build and relocated discovery
        if: runner.os == 'Linux'
        run: >-
          python3 scripts/build_recognition_native.py --target linux-x86_64
          --work native-work --cache native-inputs --download --with-tessdata --jobs 4
      - name: Windows installed toolchain license, native build and relocated discovery
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Explicit original from the official VS2022 Enterprise/Professional terms page.
          # Pin changes require renewed product/edition review; this is not rights approval.
          $termsUrl = 'https://visualstudio.microsoft.com/wp-content/uploads/2021/11/Visual-Studio-2022-Enterprise-Professional-License-EN.docx'
          $termsSha = '9c0cd52b20db9d081854c75bd1b50c75514b8f8cb09c8cad15e89d90b97b5bf3'
          $python = (py -3.12 -c 'import sys; print(sys.executable)').Trim()
          & ./scripts/prepare_windows_build.ps1 -Kind recognition -Python $python `
            -Evidence "$env:RUNNER_TEMP/windows-native-evidence" `
            -Work native-work -Output unused -Cache native-inputs `
            -TermsUrl $termsUrl -TermsSha256 $termsSha
      - name: Preserve native evidence, including failures (not redistributable binaries)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: recognition-native-${{ matrix.target }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/windows-native-evidence/
            native-work/native-candidate.json
            native-work/commands.json
            native-work/runtime-notices.json
            native-work/candidate/THIRD_PARTY_NOTICES.txt
            native-work/logs/
            native-work/candidate/licenses/
          if-no-files-found: warn
          retention-days: 14
      # No native binary is uploaded until compiler runtime redistribution is reviewed.
      # Not a runtime pack or release attestation. Static compiler runtime notices,
      # baseline OS qualification, Python/wheels and actual OCR remain separate.
