name: Native recognition dependency candidates
on:
  push:
    paths: ['scripts/windows_runtime_notice.py', 'tests/test_windows_runtime_notice.py', 'scripts/build_recognition_native.py', 'scripts/recognition-native-sources.json', '.github/workflows/recognition-native.yml']
  pull_request:
    paths: ['scripts/windows_runtime_notice.py', 'tests/test_windows_runtime_notice.py', 'scripts/build_recognition_native.py', 'scripts/recognition-native-sources.json', 'tests/test_recognition_native_builder.py', '.github/workflows/recognition-native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.10.4'
      - run: uv sync --frozen --python 3.12
      - run: uv run --frozen python -m pytest -q -W error tests/test_recognition_native_builder.py tests/test_windows_runtime_notice.py
  native:
    # Narrow builder/pin pushes bootstrap a workflow not yet on the default branch.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: contracts
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: windows-2022
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Linux native build and relocated discovery
        if: runner.os == 'Linux'
        run: >-
          python3 scripts/build_recognition_native.py --target linux-x86_64
          --work native-work --cache native-inputs --download --with-tessdata --jobs 4
      - name: Windows installed toolchain license, native build and relocated discovery
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) { throw 'Installed vswhere missing' }
          $installation = (& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $installation) { throw 'Installed x64 C++ tools missing' }
          $developer = Join-Path $installation 'Common7\Tools\Launch-VsDevShell.ps1'
          if (-not (Test-Path -LiteralPath $developer -PathType Leaf)) { throw 'Installed developer shell missing' }
          # Official installed shell initializes compiler, SDK, dumpbin and x64 environment.
          # https://learn.microsoft.com/visualstudio/ide/reference/command-prompt-powershell
          & $developer -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          if (-not $env:VSCMD_VER) { throw 'Developer environment not initialized' }
          Get-Command cl.exe, dumpbin.exe, cmake.exe | Select-Object Name, Source
          $licenses = @(Get-ChildItem -LiteralPath $installation -Filter License.rtf -Recurse -File |
            Where-Object { -not ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) } |
            Where-Object {
              $text = Get-Content -LiteralPath $_.FullName -Raw
              $text = [regex]::Replace($text, '\\[a-zA-Z]+-?\d* ?', ' ') -replace '[{}]', ' '
              $text -match '(?is)^.{0,700}MICROSOFT.{0,120}VISUAL\s+STUDIO.{0,100}2022' -and
                $text -notmatch '(?is)^.{0,700}(PRE[- ]?RELEASE\s+SOFTWARE|VS2015_CTP_EVAL)' -and
                $text -match '(?is)distributable.{0,30}code|redistribut'
            })
          if (-not $licenses.Count) { throw 'Matching Visual Studio 2022 license not found; an extension preview EULA cannot substitute for installed-product terms' }
          $hashes = @($licenses | ForEach-Object { (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash } | Sort-Object -Unique)
          if ($hashes.Count -ne 1) { throw 'Ambiguous installed Visual Studio licenses; resolve exact edition/license on the host' }
          $license = ($licenses | Sort-Object FullName | Select-Object -First 1).FullName
          py -3.12 scripts/build_recognition_native.py --target windows-x86_64 `
            --work native-work --cache native-inputs --download --with-tessdata --jobs 4 `
            --windows-runtime-license $license
          if ($LASTEXITCODE -ne 0) { throw 'Recognition native build failed' }
      - name: Preserve native evidence, including failures (not redistributable binaries)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: recognition-native-${{ matrix.target }}-${{ github.sha }}
          path: |
            native-work/native-candidate.json
            native-work/commands.json
            native-work/runtime-notices.json
            native-work/candidate/THIRD_PARTY_NOTICES.txt
            native-work/logs/
            native-work/candidate/licenses/
          if-no-files-found: warn
          retention-days: 14
      # No native binary is uploaded until compiler runtime redistribution is reviewed.
      # Not a runtime pack or release attestation. Static compiler runtime notices,
      # baseline OS qualification, Python/wheels and actual OCR remain separate.
