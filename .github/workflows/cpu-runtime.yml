name: Build pinned native CPU runtime candidates
on:
  push:
    paths: ['scripts/prepare_windows_build.ps1', 'scripts/windows_build_evidence.py', 'tests/test_windows_build_evidence.py', 'scripts/windows_runtime_notice.py', 'tests/test_windows_runtime_notice.py', 'scripts/build_cpu_runtime.py', '.github/workflows/cpu-runtime.yml']
  workflow_dispatch:
    inputs:
      pack_version:
        description: 'New immutable CPU runtime pack version (b10853-cpu.N)'
        type: string
        default: 'b10853-cpu.2'
        required: true
permissions:
  contents: read
jobs:
  runtime:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: macos-aarch64
          - os: macos-15-intel
            target: macos-x86_64
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: windows-2022
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
      PACK_VERSION: ${{ inputs.pack_version || 'b10853-cpu.2' }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.10.4'
      - name: Prepare pinned builder environment
        run: uv sync --frozen --python 3.12
      - name: Test CPU build and license contracts without loading models
        run: uv run --frozen python -m pytest -q tests/test_cpu_runtime_builder.py tests/test_windows_runtime_notice.py tests/test_windows_build_evidence.py
      - name: Build matching Unix CPU candidate
        if: runner.os != 'Windows'
        shell: bash
        run: |
          test -z "$(git status --porcelain)"
          mkdir "$RUNNER_TEMP/cpu-runtime-artifacts"
          uv run --frozen python scripts/build_cpu_runtime.py --target "$TARGET" \
            --work "$RUNNER_TEMP/cpu-runtime-build" \
            --output "$RUNNER_TEMP/cpu-runtime-artifacts/llama-cpp-cpu-$PACK_VERSION-$TARGET.pack.zip" \
            --version "$PACK_VERSION" --jobs 2
      - name: Discover installed Visual Studio tooling and actual license, then build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Explicit original from the official VS2022 Enterprise/Professional terms page.
          # Pin changes require renewed product/edition review; this is not rights approval.
          $termsUrl = 'https://visualstudio.microsoft.com/wp-content/uploads/2021/11/Visual-Studio-2022-Enterprise-Professional-License-EN.docx'
          $termsSha = '9c0cd52b20db9d081854c75bd1b50c75514b8f8cb09c8cad15e89d90b97b5bf3'
          $python = (uv python find).Trim()
          & ./scripts/prepare_windows_build.ps1 -Kind cpu -Python $python `
            -Evidence "$env:RUNNER_TEMP/windows-cpu-evidence" `
            -Work "$env:RUNNER_TEMP/cpu-runtime-build" -Output "$env:RUNNER_TEMP/cpu-runtime-artifacts" `
            -PackVersion $env:PACK_VERSION -TermsUrl $termsUrl -TermsSha256 $termsSha
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && runner.os != 'Windows'
        with:
          name: cpu-runtime-candidate-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/cpu-runtime-artifacts/
            ${{ runner.temp }}/cpu-runtime-build/configure.log
            ${{ runner.temp }}/cpu-runtime-build/build.log
            ${{ runner.temp }}/cpu-runtime-build/declaration.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve Windows review evidence without redistributing the unreviewed pack
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && runner.os == 'Windows'
        with:
          name: cpu-runtime-review-windows-x86_64
          path: |
            ${{ runner.temp }}/windows-cpu-evidence/
            ${{ runner.temp }}/cpu-runtime-build/configure.log
            ${{ runner.temp }}/cpu-runtime-build/build.log
            ${{ runner.temp }}/cpu-runtime-build/declaration.json
          if-no-files-found: warn
          retention-days: 14
      # Windows binary delivery requires a separate review of exact redistribution terms.
# Build candidates only: no model download, active pack change, release or support qualification.
