name: Build pinned native CPU runtime candidates
on:
  push:
    paths: ['scripts/prepare_windows_build.ps1', 'scripts/windows_build_evidence.py', 'tests/test_windows_build_evidence.py', 'scripts/windows_runtime_notice.py', 'tests/test_windows_runtime_notice.py', 'scripts/build_cpu_runtime.py', 'scripts/linux_abi.py', 'tests/test_linux_abi.py', '.github/workflows/cpu-runtime.yml']
  workflow_dispatch:
    inputs:
      pack_version:
        description: 'New immutable CPU runtime pack version (b10853-cpu.N)'
        type: string
        default: 'b10853-cpu.4'
        required: true
permissions:
  contents: read
jobs:
  runtime:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: macos-aarch64
          - os: macos-15-intel
            target: macos-x86_64
          - os: ubuntu-22.04
            target: linux-x86_64
          - os: ubuntu-22.04-arm
            target: linux-aarch64
          - os: windows-2022
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
      PACK_VERSION: ${{ inputs.pack_version || 'b10853-cpu.4' }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.10.4'
      - name: Prepare pinned builder environment
        run: uv sync --frozen --python 3.12
      - name: Test CPU build and license contracts without loading models
        run: uv run --frozen python -m pytest -q tests/test_linux_abi.py tests/test_cpu_runtime_builder.py tests/test_windows_runtime_notice.py tests/test_windows_build_evidence.py
      - name: Build matching Unix CPU candidate
        if: runner.os != 'Windows'
        shell: bash
        run: |
          test -z "$(git status --porcelain)"
          mkdir "$RUNNER_TEMP/cpu-runtime-artifacts"
          uv run --frozen python scripts/build_cpu_runtime.py --target "$TARGET" \
            --work "$RUNNER_TEMP/cpu-runtime-build" \
            --output "$RUNNER_TEMP/cpu-runtime-artifacts/llama-cpp-cpu-$PACK_VERSION-$TARGET.pack.zip" \
            --version "$PACK_VERSION" --jobs 2
      - name: Relocated bookworm cpu startup (not final image qualification)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          EVIDENCE="$RUNNER_TEMP/bookworm-cpu-evidence"
          mkdir "$EVIDENCE"
          case "$TARGET" in
            linux-x86_64) PROBE_PLATFORM=linux/amd64; EXPECTED_ARCH=amd64 ;;
            linux-aarch64) PROBE_PLATFORM=linux/arm64; EXPECTED_ARCH=arm64 ;;
            *) exit 1 ;;
          esac
          export EXPECTED_ARCH
          # Native hosted runner only, no QEMU/binfmt or self-hosted registration.
          # Provision only this explicit official test image; no document-time fetch.
          timeout 300 docker pull --platform "$PROBE_PLATFORM" python:3.12-bookworm
          IMAGE=$(timeout 30 docker image inspect python:3.12-bookworm --format '{{index .RepoDigests 0}}')
          timeout 30 docker image inspect "$IMAGE" --format '{{json .}}' | python3 -c 'import json,os,sys; x=json.load(sys.stdin); assert x["Architecture"]==os.environ["EXPECTED_ARCH"] and x["Os"]=="linux"; print(json.dumps({k:x[k] for k in ("Id","RepoDigests","Architecture","Os")}))' > "$EVIDENCE/probe-image.json"
          CID=""
          cleanup() {
            if [ -s "$EVIDENCE/container-id.txt" ]; then CID=$(cat "$EVIDENCE/container-id.txt"); fi
            if [[ "$CID" =~ ^[0-9a-f]{64}$ ]]; then
              timeout 30 docker inspect "$CID" --format '{{json .State}}' > "$EVIDENCE/container-state.json" 2>&1 || true
              timeout 60 docker rm --force "$CID" > "$EVIDENCE/cleanup.txt" 2>&1
            fi
          }
          trap cleanup EXIT
          timeout 60 docker create --cidfile "$EVIDENCE/container-id.txt" --platform "$PROBE_PLATFORM" --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 \
            --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,exec,size=2g \
            --mount "type=bind,src=$GITHUB_WORKSPACE/scripts/linux_abi.py,dst=/probe.py,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/cpu-runtime-artifacts/llama-cpp-cpu-$PACK_VERSION-$TARGET.pack.zip,dst=/input/archive.zip,readonly" \
            --mount "type=bind,src=$EVIDENCE,dst=/evidence" \
            "$IMAGE" python /probe.py --archive /input/archive.zip --output /evidence/result \
            --target "$TARGET" --startup cpu --startup-only > "$EVIDENCE/create.txt"
          CID=$(cat "$EVIDENCE/container-id.txt")
          timeout 30 docker inspect "$CID" --format '{{json .Image}}' > "$EVIDENCE/container-image.json"
          python3 -c 'import json,sys; from pathlib import Path; p=Path(sys.argv[1]); assert json.loads((p/"container-image.json").read_text())==json.loads((p/"probe-image.json").read_text())["Id"]' "$EVIDENCE"
          timeout 300 docker start --attach "$CID" > "$EVIDENCE/container-log.txt" 2>&1
          CODE=$(timeout 30 docker inspect "$CID" --format '{{.State.ExitCode}}')
          printf '%s\n' "$CODE" > "$EVIDENCE/container-exit.txt"
          test "$CODE" = 0
      - name: Discover installed Visual Studio tooling and actual license, then build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Explicit original from the official VS2022 Enterprise/Professional terms page.
          # Pin changes require renewed product/edition review; this is not rights approval.
          $termsUrl = 'https://visualstudio.microsoft.com/wp-content/uploads/2021/11/Visual-Studio-2022-Enterprise-Professional-License-EN.docx'
          $termsSha = '9c0cd52b20db9d081854c75bd1b50c75514b8f8cb09c8cad15e89d90b97b5bf3'
          $python = (uv python find).Trim()
          & ./scripts/prepare_windows_build.ps1 -Kind cpu -Python $python `
            -Evidence "$env:RUNNER_TEMP/windows-cpu-evidence" `
            -Work "$env:RUNNER_TEMP/cpu-runtime-build" -Output "$env:RUNNER_TEMP/cpu-runtime-artifacts" `
            -PackVersion $env:PACK_VERSION -TermsUrl $termsUrl -TermsSha256 $termsSha
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && runner.os != 'Windows'
        with:
          name: cpu-runtime-candidate-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/cpu-runtime-artifacts/
            ${{ runner.temp }}/cpu-runtime-build/configure.log
            ${{ runner.temp }}/cpu-runtime-build/build.log
            ${{ runner.temp }}/cpu-runtime-build/declaration.json
            ${{ runner.temp }}/cpu-runtime-build/linux-toolchain.json
            ${{ runner.temp }}/cpu-runtime-build/stage/*-abi.txt
            ${{ runner.temp }}/bookworm-cpu-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve Windows review evidence without redistributing the unreviewed pack
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && runner.os == 'Windows'
        with:
          name: cpu-runtime-review-windows-x86_64
          path: |
            ${{ runner.temp }}/windows-cpu-evidence/
            ${{ runner.temp }}/cpu-runtime-build/configure.log
            ${{ runner.temp }}/cpu-runtime-build/build.log
            ${{ runner.temp }}/cpu-runtime-build/declaration.json
            ${{ runner.temp }}/cpu-runtime-build/linux-toolchain.json
            ${{ runner.temp }}/cpu-runtime-build/stage/*-abi.txt
            ${{ runner.temp }}/bookworm-cpu-evidence/
          if-no-files-found: warn
          retention-days: 14
      # Windows binary delivery requires a separate review of exact redistribution terms.
# Build candidates only: no model download, active pack change, release or support qualification.
